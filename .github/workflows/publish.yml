name: Publish command-code to AUR

on:
  push:
    branches: [main]
    paths:
      - 'command-code/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6

      - name: Read package version
        id: vars
        working-directory: command-code
        run: |
          echo "pkgver=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          git config --global user.name "${{ secrets.AUR_USERNAME }}"
          git config --global user.email "${{ secrets.AUR_EMAIL }}"

          git clone aur@aur.archlinux.org:command-code.git /tmp/aur
          cd /tmp/aur

          # Remove stale files that should not be in the AUR repo
          rm -f AGENTS.md README.md command-code.license

          # Copy in fresh PKGBUILD and LICENSE
          cp "$GITHUB_WORKSPACE/command-code/PKGBUILD" .
          cp "$GITHUB_WORKSPACE/command-code/LICENSE" .

          # Regenerate .SRCINFO
          makepkg --printsrcinfo > .SRCINFO

          git add -A
          git diff --staged --quiet || \
            git commit -m "upgpkg: command-code ${{ steps.vars.outputs.pkgver }}-${{ steps.vars.outputs.pkgrel }}"
          git push
