name: Verify command-code build

on:
  pull_request:
    paths:
      - 'command-code/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm --needed npm jq github-cli git
          useradd -m builder

      - name: Build package
        working-directory: command-code
        run: |
          chown -R builder:builder .
          runuser -u builder -- makepkg -sf --noconfirm

      - name: Merge and publish
        if: success() && startsWith(github.event.pull_request.head.ref, 'bump/') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          gh workflow run publish.yml --ref main
