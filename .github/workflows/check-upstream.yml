name: Check upstream version

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed git npm jq github-cli

      - name: Configure git
        run: |
          git -C "$GITHUB_WORKSPACE" config user.name  'command-code-bot'
          git -C "$GITHUB_WORKSPACE" config user.email 'ismet.togay@gmail.com'

      - name: Detect upstream version
        id: detect
        working-directory: command-code
        run: |
          current=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          latest=$(curl -sL https://registry.npmjs.org/command-code/latest | jq -r .version)
          echo "current=$current"
          echo "latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine latest npm version"
            exit 1
          fi
          if [ "$current" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          echo "new_version=$latest" >> "$GITHUB_OUTPUT"

      - name: Bump PKGBUILD
        if: steps.detect.outputs.up_to_date == 'false'
        working-directory: command-code
        run: |
          new="${{ steps.detect.outputs.new_version }}"
          sed -i "s/^pkgver=.*/pkgver=$new/"  PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"     PKGBUILD
          updpkgsums PKGBUILD
          makepkg --printsrcinfo > .SRCINFO

      - name: Open pull request
        if: steps.detect.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            command-code/PKGBUILD
            command-code/.SRCINFO
          branch: bump/command-code-${{ steps.detect.outputs.new_version }}
          commit-message: 'command-code: update to ${{ steps.detect.outputs.new_version }}'
          delete-branch: true
          title: 'command-code: update to ${{ steps.detect.outputs.new_version }}'
          body: |
            Automated upstream version bump.

            - Previous: `${{ steps.detect.outputs.current }}`
            - New:      `${{ steps.detect.outputs.new_version }}`

            The `pr-verify` workflow will run `makepkg` to confirm the build, then enable
            auto-merge. Once green, this lands on `main` and the `publish` workflow pushes
            the package to AUR.
          token: ${{ secrets.GITHUB_TOKEN }}
